# ModelWeave gateway configuration (reference).
# Durations use Go syntax ("250ms", "30s", "10m"). ${VAR} is expanded from the
# environment.

server:
  listen: ":8080"
  max_body_bytes: 33554432          # 32 MiB request limit
  log_level: info                   # debug | info | warn | error
  log_format: json                  # json | text
  request_timeout: 30m              # whole-request limit
  first_token_timeout: 120s         # one absolute deadline shared by every stage and retry
  idle_timeout: 120s                # max gap between output events once streaming
  expose_routing_headers: true      # X-ModelWeave-Mode / -Decode-Worker / -Prefill-Worker ...
  shutdown_grace: 30s
  control_token: ""                 # if set, /mwip/v1/* and /admin/* require X-ModelWeave-Token

tokenizer:
  endpoints: ["http://tokenizer:8090"]   # round-robin; each request pins one replica
  timeout: 30s                           # render timeout

# How the gateway calls inference workers with the tokenizer's intermediate
# state (token list + media placements, docs/protocol.md). The gateway flag
# -engine-protocol (env MW_ENGINE_PROTOCOL) overrides it; a model's
# engine_protocol overrides both.
engine:
  protocol: mwip                    # mwip: send the intermediate state as is (POST /mwip/v1/generate)
                                    # vllm: adapt to POST /inference/v1/generate (token in, derender out,
                                    #       kv_transfer_params / ec_transfer_params for PD / EPD)
                                    # sglang: adapt to POST /generate (input_ids + image_data,
                                    #       bootstrap_* for PD; SGLang encodes media itself)

auth:
  enabled: false                    # true: unknown or missing API keys get 401
  anonymous_tenant: anonymous       # tenant of keyless requests when auth is disabled

# Tenants are identified by API key (Authorization: Bearer <key> or x-api-key).
tenants:
  - name: team-a
    api_keys: ["sk-team-a"]
    priority: high                  # critical | high | normal | low
    weight: 2                       # fair-share weight inside its priority class
    rpm: 600                        # requests per minute (0 = unlimited)
    tpm: 2000000                    # prompt+completion tokens per minute (0 = unlimited)
    max_concurrency: 128

discovery:
  heartbeat_ttl: 15s                # workers registered by heartbeat expire after this
  workers: []                       # static workers (role: encode | prefill | decode | unified), e.g.
  # - {id: e0, model: deepseek-v4.1, role: encode, url: "http://10.0.0.4:8000"}
  # - {id: p0, model: deepseek-v4.1, role: prefill, url: "http://10.0.0.5:8000",
  #    bootstrap_addr: "http://10.0.0.5:8998", engine_id: "p0-engine"}   # bootstrap handshake
  # - {id: d0, model: deepseek-v4.1, role: decode, url: "http://10.0.0.6:8000", normal: true,
  #    kv_capacity_tokens: 1048576, max_running_requests: 256}         # also runs normal requests
  # - {id: u0, model: deepseek-v4.1, role: unified, url: "http://10.0.0.7:30000"}

engine_state:
  stale_after: 10s                  # ignore engine state older than this
  poll:                             # pull-based state (in addition to heartbeats)
    enabled: false
    interval: 2s
    timeout: 1s
    format: mwip                    # mwip (GET /mwip/v1/state) | prometheus (GET /metrics)
    preset: vllm                    # prometheus metric mapping: vllm | sglang | modelweave
    metrics: {}                     # per-field overrides, e.g. {running_requests: "my_engine:running"}

health:
  failure_threshold: 3              # consecutive transport failures before ejection
  cooldown: 10s

# Prefix-cache awareness.
kv_index:
  type: approx                      # approx (learned from routing) | events (engine KV events)
                                    # | remote (external KV metadata service) | none
  block_size: 64                    # tokens per hashed block (engines must match for events)
  ttl: 10m                          # approx: forget blocks not routed for this long
  capacity_blocks: 0                # approx: per-worker bound; 0 derives it from KV capacity
  optimistic_ttl: 30s               # events: bridge the gap until the engine's stored event
  remote_url: ""                    # remote: POST {remote_url}/v1/prefix/match
  remote_timeout: 50ms              # remote falls back to approx on error or timeout

models:
  - name: deepseek-v4.1
    aliases: ["DeepSeek-V4.1-Flash", "deepseek-flash"]
    tokenizer_model: DeepSeek-V4.1-Flash   # model name the tokenizer knows
    engine_model: ""                # served model name sent to engines (vLLM checks it); empty: omitted
    engine_protocol: ""             # mwip | vllm | sglang; empty: engine.protocol
    context_length: 0               # 0: the model's window in the tokenizer; set lower to cap it
    # auto: normal or pd per request (normal on unified workers, or on decode
    # workers with normal: true); or force normal | pd.
    mode: auto
    pd:
      handshake: ""                 # push (D registers, P pushes KV; mwip, vLLM extension) | bootstrap
                                    # (SGLang bootstrap_*, vLLM MooncakeConnector; required for sglang)
                                    # | pull (P returns a KV handle / vLLM NixlConnector params)
                                    # empty: push for mwip, bootstrap for vllm and sglang
    normal:                         # normal = no PD split: a decode worker runs prefill itself
      enabled: true
      max_uncached_tokens: 1024     # run normal when the decode worker computes at most this many tokens
      min_cache_ratio: 0.6          # ... or already caches this fraction of the prompt
      session_affinity: true        # follow-up turns run normal on the session's decode worker
      session_ttl: 30m
      fallback_to_pd: true          # a failed normal attempt retries as pd (once, before output)
    encode:                         # E stage: mwip embedding artifacts, vLLM EC producer (ec_transfer_params);
                                    # sglang encodes inside the engine (--encoder-urls), no gateway E stage
      policy: auto                  # auto (E stage when encoders exist) | always | never
      artifact_cache_ttl: 1h        # content-addressed embedding artifacts
      artifact_cache_max: 10000
    reservation:
      output_tokens: 1024           # output tokens reserved on decode (prompt + min(max_tokens, this))
      block_size: 64                # round KV reservations to blocks
      uncached_beta: 0              # prefill cost w = u*(1+beta*(cached+u/2)); 0 = plain tokens
    routing:                        # policy per role: cache_aware | weighted | least_load
      prefill:                      #   | power_of_two | round_robin | random | session_affinity
        policy: cache_aware
        cache_threshold: 0.3
        balance_abs_threshold: 32768 # queued prefill tokens
        balance_rel_threshold: 1.5
      decode:
        policy: cache_aware
        cache_threshold: 0.3
        balance_abs_threshold: 32   # running requests
      unified:
        policy: cache_aware
      encode:
        policy: least_load
    admission:
      queue_size: 512               # requests waiting for capacity
      max_wait: 30s
      backfill_depth: 4             # let smaller requests use capacity a large one cannot
      overload:                     # utilization-level shedding by priority
        enabled: true
        thresholds: [0.75, 0.85, 0.90, 0.95]
        hysteresis: 0.02
        cache_exempt_ratio: 0.8     # mostly-cached requests are exempt from drops
    retry:
      stage_attempts: 3             # decode/normal attempts on different workers
      whole_retries: 1              # pd re-runs after a prefill failure
      backoff: 20ms
