# Gateway config of the local stack (see docker-compose.yaml): DeepSeek V4.1,
# Qwen3 and Qwen3-VL, one tokenizer for all of them.
server:
  listen: ":8080"
  log_format: json
  expose_routing_headers: true
  first_token_timeout: 30s
  idle_timeout: 30s
  control_token: ${MW_CONTROL_TOKEN}     # workers and admin calls send X-ModelWeave-Token
tokenizer:
  endpoints: ["http://tokenizer:8090"]
auth:
  enabled: true
tenants:
  - {name: team-a, api_keys: ["sk-team-a"], priority: high, weight: 2}
  - {name: team-b, api_keys: ["sk-team-b"], priority: normal}
  - {name: limited, api_keys: ["sk-limited"], priority: normal, rpm: 3}
  - {name: batch, api_keys: ["sk-batch"], priority: low}
discovery:
  heartbeat_ttl: 6s
  workers:
    # Registered statically (no heartbeat); its load comes from /metrics polling.
    - {id: tiny-0, model: deepseek-v4.1-tiny, role: unified, url: "http://tiny-0:9000", max_running_requests: 1}
engine_state:
  stale_after: 5s
  poll: {enabled: true, interval: 1s, format: prometheus, preset: modelweave}
health: {failure_threshold: 2, cooldown: 30s}
kv_index: {type: approx, block_size: 64, ttl: 30m}

# Default engine protocol of this replica: the tokenizer's intermediate state
# as is (POST /mwip/v1/generate). Models below override it where they test the
# vLLM and SGLang adapters; the gateway-events replica is started with
# -engine-protocol vllm instead.
engine:
  protocol: mwip

models:
  # mwip: auto normal/pd, push handshake, EPD with cached embedding artifacts.
  - name: deepseek-v4.1
    aliases: ["DeepSeek-V4.1-Flash", "deepseek-flash"]
    tokenizer_model: DeepSeek-V4.1-Flash
    mode: auto
    pd: {handshake: push}
    normal: {enabled: true, max_uncached_tokens: 512, min_cache_ratio: 0.6, session_affinity: true, fallback_to_pd: true}
    encode: {policy: auto}
    routing:
      prefill: {policy: cache_aware, cache_threshold: 0.3}
      decode: {policy: cache_aware, cache_threshold: 0.3}
    admission:
      overload: {enabled: true}

  # vLLM adapter: token-in /inference/v1/generate (derender), PD through
  # MooncakeConnector-style kv_transfer_params (bootstrap), EPD through an
  # EC producer (ec_transfer_params), normal on the decode worker.
  - name: deepseek-v4.1-vllm
    tokenizer_model: DeepSeek-V4.1-Flash
    engine_protocol: vllm
    mode: auto
    pd: {handshake: bootstrap}
    normal: {enabled: true, max_uncached_tokens: 512, fallback_to_pd: true}

  # mwip, pull handshake: P returns a kv_handle, D fetches the KV.
  - name: deepseek-v4.1-pull
    tokenizer_model: DeepSeek-V4.1-Flash
    mode: pd
    pd: {handshake: pull}

  # SGLang adapter (POST /generate, bootstrap_host/port/room). Media go to
  # the prefill server raw (image_data): SGLang encodes them on its own
  # encoders, so the registered encoder is never called by the gateway.
  # SGLang's native API returns raw text: no engine-side parsing.
  - name: deepseek-v4.1-sglang
    tokenizer_model: DeepSeek-V4.1-Flash
    engine_protocol: sglang
    mode: pd

  # normal rejected by the decode worker -> pd.
  - name: deepseek-v4.1-fallback
    tokenizer_model: DeepSeek-V4.1-Flash
    mode: auto
    normal: {enabled: true, max_uncached_tokens: 4096, fallback_to_pd: true}

  # normal on unified workers, session affinity, one broken worker.
  - name: deepseek-v4.1-normal
    tokenizer_model: DeepSeek-V4.1-Flash
    mode: normal
    routing:
      unified: {policy: session_affinity, fallback: cache_aware}
    retry: {stage_attempts: 3}

  - name: deepseek-v4.1-tiny
    tokenizer_model: DeepSeek-V4.1-Flash
    context_length: 131072          # caps the model's 1M window
    mode: normal
    admission: {queue_size: 2, max_wait: 15s}

  # Qwen3-8B: hybrid thinking (<think>), hermes tool calls; auto normal/pd.
  - name: qwen3
    aliases: ["Qwen3-8B"]
    tokenizer_model: Qwen3-8B
    mode: auto
    pd: {handshake: push}
    normal: {enabled: true, max_uncached_tokens: 512, min_cache_ratio: 0.6, session_affinity: true, fallback_to_pd: true}

  # Qwen3-VL: images and videos planned like the Qwen3-VL processor, an
  # encode stage with cached artifacts (one per image or kept frame).
  - name: qwen3-vl
    aliases: ["Qwen3-VL-8B-Instruct"]
    tokenizer_model: Qwen3-VL-8B-Instruct
    mode: auto
    pd: {handshake: push}
    normal: {enabled: true, max_uncached_tokens: 512, fallback_to_pd: true}

  # Qwen3-VL over SGLang: media collapse to the model's placeholders and go
  # raw as image_data / video_data.
  - name: qwen3-vl-sglang
    tokenizer_model: Qwen3-VL-8B-Instruct
    engine_protocol: sglang
    mode: normal
