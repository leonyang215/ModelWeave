apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: modelweave
resources:
  - serviceaccount.yaml
  - gateway.yaml
  - tokenizer.yaml
  - services.yaml
  - disruptionbudgets.yaml
configMapGenerator:
  - name: gateway-config
    files: [gateway.yaml=config/gateway.yaml]
  - name: tokenizer-config
    files: [tokenizer.toml=config/tokenizer.toml]
