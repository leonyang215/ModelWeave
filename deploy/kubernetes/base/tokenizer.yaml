apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenizer
  labels: {app.kubernetes.io/name: modelweave, app.kubernetes.io/component: tokenizer}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: modelweave, app.kubernetes.io/component: tokenizer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: modelweave, app.kubernetes.io/component: tokenizer}
    spec:
      serviceAccountName: modelweave
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: tokenizer
          image: modelweave/tokenizer:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: MW_TOKENIZER_CONFIG, value: /etc/modelweave/tokenizer.toml}
            - {name: MW_TOKENIZER_LISTEN, value: "0.0.0.0:8090"}
          ports: [{name: http, containerPort: 8090}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/modelweave, readOnly: true}
      volumes:
        - name: config
          configMap: {name: tokenizer-config}
