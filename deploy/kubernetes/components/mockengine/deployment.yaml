# Shared GPU-free engine template; role overlays give each Deployment a
# distinct name and selector. Individual instances advertise their Pod IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockengine
  labels: {app.kubernetes.io/name: modelweave, app.kubernetes.io/component: mockengine}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: modelweave, app.kubernetes.io/component: mockengine}
  template:
    metadata:
      labels: {app.kubernetes.io/name: modelweave, app.kubernetes.io/component: mockengine}
    spec:
      serviceAccountName: modelweave
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: engine
          image: modelweave/mockengine:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 9000}
            - {name: mwip, containerPort: 9001}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: MOCK_ID, value: "$(POD_NAME)"}
            - {name: MOCK_ROLE, value: unified}
            - {name: MOCK_MODEL, value: deepseek-v4.1}
            - {name: MOCK_TOKENIZER_MODEL, value: DeepSeek-V4.1-Flash}
            - {name: MOCK_TOKENIZER_URL, value: "http://tokenizer:8090"}
            - {name: MOCK_REGISTRY, value: "gateway:8081"}
            - {name: MOCK_ADVERTISE_URL, value: "http://$(POD_IP):9000"}
            - {name: MOCK_TARGET, value: "$(POD_IP):9001"}
            - {name: MOCK_KV_EVENTS, value: "true"}
            - {name: MOCK_NORMAL, value: "true"}
            - name: MOCK_CONTROL_TOKEN
              valueFrom: {secretKeyRef: {name: modelweave-secrets, key: MW_CONTROL_TOKEN}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
