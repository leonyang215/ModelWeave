apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../../../components/mockengine]
nameSuffix: -prefill
labels:
  - pairs: {modelweave.io/role: prefill}
    includeSelectors: true
patches:
  - target: {kind: Deployment, name: mockengine}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mockengine}
      spec:
        template:
          spec:
            containers:
              - name: engine
                env:
                  - {name: MOCK_ROLE, value: prefill}
