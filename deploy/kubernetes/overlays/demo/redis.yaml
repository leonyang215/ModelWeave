# Ephemeral, unauthenticated Redis confined to this demo namespace/service.
# Production base deliberately requires an externally managed Redis endpoint.
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: modelweave, app.kubernetes.io/component: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: modelweave, app.kubernetes.io/component: redis}
    spec:
      serviceAccountName: modelweave
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
          command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, noeviction]
          ports: [{name: redis, containerPort: 6379}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 3
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: modelweave, app.kubernetes.io/component: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
